spring:
  application:
    name: est-des
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/garage}
    username: ${DB_USER:garage}
    password: ${DB_PASSWORD:garage}
  flyway:
    enabled: true

server:
  port: 3003

garage:
  simulator:
    url: ${SIMULATOR_URL:http://localhost:3000}
  sync:
    enabled: true
  rate-limit:
    enabled: true
    webhook:
      burst: 200
      refill-per-second: 100
    revenue:
      burst: 30
      refill-per-second: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,garageSync
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    correlation: "[%X{request_id:-}] "
